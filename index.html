<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Language" content="ar">
    <meta name="description" content="شركة خدمات لوجستية متكاملة">
    <title>شركة الخدمات اللوجستية</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="logo">
                <img src="لوجو.png" alt="شعار الشركة">
            </div>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h1>شريككم في التميز الفندقي</h1>
            <p>متخصصون في حلول النظافة والتعقيم المتكاملة للفنادق والمنشآت السياحية</p>
        </div>
        <img src="بنر.png" alt="بنر الشركة" class="hero-image">
    </section>

    <!-- About Section Removed -->
    <!-- Services Section Removed -->

    <!-- Features Section Removed -->

    <!-- Contact Section -->
    <section class="contact">
        <div class="container">
            <h2 class="section-title">تواصل معنا</h2>
            <div class="contact-content">
                <div class="contact-info">
                    <div class="info-item">
                        <i class="fas fa-phone"></i>
                        <div>
                            <h4>الهاتف</h4>
                            <p>01024754083</p>
                        </div>
                    </div>
                </div>
                <form class="contact-form" id="whatsappForm">
                    <input type="text" id="name" placeholder="الاسم" required>
                    <input type="email" id="email" placeholder="البريد الإلكتروني">
                    <input type="tel" id="phone" placeholder="رقم الهاتف" required>
                    <textarea id="message" placeholder="الرسالة" rows="5" required></textarea>
                    <button type="submit" class="btn btn-primary">إرسال</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">
                    <img src="لوجو.png" alt="شعار الشركة">
                </div>
                <div class="footer-social">
                    <h4>تابعنا</h4>
                    <div class="social-links">
                        <a href="https://wa.me/201024754083"><i class="fab fa-whatsapp"></i></a>
                    </div>
                </div>
            </div>
            <div class="footer-bottom">
                <p>جميع الحقوق محفوظة © 2024 شركة الخدمات اللوجستية</p>
            </div>
        </div>
    </footer>

    <script src="script.js?v=2"></script>
    <script>
        document.getElementById('whatsappForm').addEventListener('submit', function(e) {
            e.preventDefault();

            var name = document.getElementById('name').value;
            var email = document.getElementById('email').value;
            var phone = document.getElementById('phone').value;
            var message = document.getElementById('message').value;

            if (!name || !phone || !message) {
                alert('يرجى ملء جميع الحقول المطلوبة');
                return;
            }

            var whatsappMessage = '*رسالة جديدة من الموقع*\n\n';
            whatsappMessage += '👤 الاسم: ' + name + '\n';
            whatsappMessage += '📱 الهاتف: ' + phone + '\n';
            if (email) {
                whatsappMessage += '📧 البريد الإلكتروني: ' + email + '\n';
            }
            whatsappMessage += '💬 الرسالة:\n' + message;

            var whatsappNumber = '201024754083';
            var whatsappUrl = 'https://wa.me/' + whatsappNumber + '?text=' + encodeURIComponent(whatsappMessage);
            window.open(whatsappUrl, '_blank');

            this.reset();
        });
    </script>
</body>
</html>
